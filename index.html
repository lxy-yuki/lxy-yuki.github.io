<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XX基金会</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #fff;
        }

        /* 左侧主内容区 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 顶部Logo+标题 */
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }
        .logo {
            width: 60px;
            height: 60px;
            border: 2px solid #3e2723;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: #3e2723;
        }
        .title {
            font-size: 2.5em;
            color: #3e2723;
        }

        /* 搜索栏 */
        .search-bar {
            width: 80%;
            max-width: 650px;
            height: 55px;
            background-color: #3e2723;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            margin-bottom: 40px;
        }
        .search-icon {
            color: #fff;
            font-size: 1.3em;
            margin-right: 15px;
        }
        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.1em;
            outline: none;
        }
        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        .search-confirm {
            background-color: #fff;
            color: #3e2723;
            border: none;
            padding: 6px 18px;
            border-radius: 3px;
            font-size: 1em;
            cursor: pointer;
            margin-left: 15px;
        }
        .search-confirm:hover {
            background-color: #f5f5f5;
        }
        .search-dot {
            width: 15px;
            height: 15px;
            border: 2px solid #fff;
            border-radius: 50%;
            margin-left: 10px;
        }

        /* Slogan 文字 */
        .slogan {
            font-size: 1.3em;
            color: #3e2723;
            font-style: italic;
        }

        /* 右侧侧边栏 */
        aside {
            width: 220px;
            background-color: #3e2723;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            gap: 25px;
        }

        /* 用户头像 */
        .user-avatar {
            width: 80px;
            height: 80px;
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .user-avatar::after {
            content: "👤";
            font-size: 2em;
        }

        /* 侧边栏按钮 */
        .sidebar-btn {
            width: 100%;
            padding: 12px;
            background-color: #5d4037;
            border: 1px solid #fff;
            border-radius: 4px;
            color: #fff;
            font-size: 1.1em;
            cursor: pointer;
        }
        .sidebar-btn:hover {
            background-color: #795548;
        }

        /* 弹窗样式（仅保留功能） */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            max-width: 420px;
        }
        .modal-content p {
            font-size: 16px;
            margin-bottom: 20px;
        }
        .modal-btn {
            float: right;
            background: #3e2723;
            color: #fff;
            border: none;
            padding: 8px 22px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <div class="header">
            <div class="logo">logo</div>
            <div class="title">XX基金会</div>
        </div>

        <div class="search-bar">
            <div class="search-icon">🔍</div>
            <input type="text" id="search-input" placeholder="请输入搜索内容">
            <button class="search-confirm" id="search-btn">确认</button>
            <div class="search-dot"></div>
        </div>

        <div class="slogan">加入基金会，享上流人生！</div>
    </main>

    <aside>
        <div class="user-avatar"></div>
        <button class="sidebar-btn">个人信息</button>
        <button class="sidebar-btn" id="record-btn">调查记录</button>
        <button class="sidebar-btn" id="help-btn">帮助</button>
        <button class="sidebar-btn">调查结束</button>
    </aside>

    <!-- 自动弹窗 -->
    <div class="modal-overlay" id="autoModal">
        <div class="modal-content">
            <p>你关注的账号更新新动态啦，可随时前往查看！</p>
            <button class="modal-btn" id="modalConfirm">确认</button>
        </div>
    </div>

    <script>
        // 搜索功能
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        function jumpToDetail() {
            const keyword = searchInput.value.trim();
            if(keyword==='海洋馆溺亡美人鱼案') window.location.href='detail1.html';
            else if(keyword==='海洋馆') window.location.href='result1.html';
            else if(keyword==='陈树1999') window.location.href='shuchen.html';
            else window.location.href='404.html';
        }
        searchBtn.addEventListener('click', jumpToDetail);
        searchInput.addEventListener('keydown',e=>{if(e.keyCode===13)jumpToDetail()});

        // 侧边栏跳转
        document.getElementById('record-btn').onclick=()=>window.location.href='record.html';
        document.getElementById('help-btn').onclick=()=>window.location.href='help.html';

        // ====================== 自动弹窗逻辑 ======================
        const autoModal = document.getElementById('autoModal');
        const modalConfirm = document.getElementById('modalConfirm');

        // 页面加载3秒后判断是否弹窗
        window.onload = () => {
            if(localStorage.getItem('hasClickedLink') === 'true'){
                setTimeout(()=>{
                    autoModal.style.display='flex';
                    // 新增：弹窗弹出时，页面背景变为深红色
                    document.body.style.backgroundColor = '#8B0000';
                },3000);
            }
        };

        // 确认按钮跳转（修改为你的目标网址）
        modalConfirm.onclick = () => {
            // 新增：点击确认后恢复页面原始白色背景
            document.body.style.backgroundColor = '#fff';
            window.location.href = 'shuchen1.html';
            localStorage.removeItem('hasClickedLink');
        };
    </script>
</body>
</html>
