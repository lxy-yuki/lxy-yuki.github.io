<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杏仁网 - 你的共享电子日记岛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        /* 页面整体布局 */
        body {
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ========== 左侧主内容区 ========== */
        .main-area {
            flex: 1;
            background-color: #ffe8a8;
            padding: 6% 8%;
            display: flex;
            flex-direction: column;
            gap: 8%;
            position: relative;
        }

        /* ========== 顶部图片插入区域（可调整位置） ========== */
        .img-container {
            height: 200px;
            position: absolute;
            top: 5%;
            left: 80px;
            width: calc(100% - 16%);
        }

        .img-container img {
            position: absolute;
            top: 0px;
            left: 0px;
            height: 100%;
            width: auto;
        }

        /* ========== 搜索栏 ========== */
        .search-bar {
            width: 100%;
            height: 180px;
            background-color: #FFF1F1;
            border-radius: 45px;
            display: flex;
            align-items: center;
            padding: 0 35px;
            position: relative;
            margin-top: 150px;
        }

        .search-input {
            flex: 1;
            height: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 24px;
            color: #887766;
            padding-right: 100px;
        }

        .search-input::placeholder {
            color: #d4c4b0;
        }

        /* ========== 搜索栏右侧图片（可调节位置与大小） ========== */
        .search-side-img {
            position: absolute;
            right: -45px;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: auto;
            pointer-events: none;
        }

        /* ========== 右侧边栏 ========== */
        .sidebar {
            width: 220px;
            background-color: #FFD9A8;
            padding: 80px 20px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* ===== 修改：关注列表标题字号调小三分之一，字间距适当增大，高度保持不变 ===== */
        .sidebar-title {
            color: #ffffff;
            font-size: 21px;                /* 原32px缩小三分之一，约21.33px，取整21px */
            font-weight: 500;
            letter-spacing: 7px;            /* 原2px增大到4px，字间距更宽松 */
            flex-shrink: 0;
            height: 40px;                   /* 固定高度，保持原来标题所在位置高度不变 */
            line-height: 40px;              /* 行高与高度一致，文字垂直居中 */
            text-align: center;             /* 文字水平居中 */
            width: 100%;                    /* 占满宽度，便于居中 */
        }

        /* 搜索记录列表容器 */
        .follow-list {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* 清空历史按钮 */
        .clear-btn {
            width: 100%;
            padding: 10px 0;
            background-color: #FFE3C1;
            color: #8B6B3D;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            flex-shrink: 0;
        }

        .clear-btn:hover {
            background-color: #FFD6A8;
        }

        /* 列表项样式 */
        .follow-item {
            width: 100%;
            padding: 14px 16px;
            background-color: #FFE3C1;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: block;
        }

        .follow-item:hover {
            background-color: #FFD6A8;
            transform: translateX(-2px);
        }

        .follow-item-name {
            font-size: 16px;
            color: #8B6B3D;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .follow-item-desc {
            font-size: 12px;
            color: #B5956A;
            line-height: 1.4;
        }

        /* 空状态提示 */
        .empty-tip {
            text-align: center;
            color: #C4A47A;
            font-size: 14px;
            padding: 30px 0;
            line-height: 1.5;
        }

        /* 滚动条美化 */
        .follow-list::-webkit-scrollbar {
            width: 4px;
        }
        .follow-list::-webkit-scrollbar-thumb {
            background-color: #E8C694;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <!-- 左侧主内容 -->
    <div class="main-area">
        <div class="img-container">
            <img src="images/xingren5.png" alt="顶部自定义图片">
        </div>

        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="输入关键词搜索...">
            <img class="search-side-img" src="images2/mirror4.png" alt="右侧自定义图片">
        </div>
    </div>

    <!-- 右侧边栏：搜索历史记录 -->
    <div class="sidebar">
        <div class="sidebar-title">关注列表</div>
        <div class="follow-list" id="followList">
            <div class="empty-tip">搜索记录<br>将显示在这里</div>
        </div>
        <button class="clear-btn" id="clearBtn">清空历史记录</button>
    </div>

    <script>
        // ========== 1. 自定义关键词映射表 ==========
        const keywordMap = {
            "陈树": {
                name: "陈树",
                desc: "苹果树",
                url: "socialaccount1.html"
            },
            "李挚圆": {
                name: "李挚圆",
                desc: "一枚圆子",
                url: "socialaccount-yuan.html"
            },
            "刘真": {
                name: "刘真",
                desc: "最爱海豚",
                url: "socialaccount-lz.html"
            },
            "赵雨虹": {
                name: "赵雨虹",
                desc: "雨后彩虹rainbow",
                url: "socialaccount2.html"
            },
            "张智": {
                name: "张智",
                desc: "海洋知识智慧哥哥",
                url: "socialaccount-zhangz.html"
            },
            "钱蔚东": {
                name: "钱蔚东",
                desc: "IM a changed man.",
                url: "socialaccount3.html"
            },
            "有需要，找小周": {
                name: "周伟",
                desc: "有需要，找小周.",
                url: "socialaccount-zw.html"
            }
        };

        const listContainer = document.getElementById('followList');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');

        // ========== 2. 使用内存变量存储搜索历史（页面关闭自动清空） ==========
        let historyList = [];

        // ========== 3. 渲染右侧列表 ==========
        function renderHistoryList() {
            listContainer.innerHTML = '';

            if (historyList.length === 0) {
                listContainer.innerHTML = '<div class="empty-tip">搜索记录<br>将显示在这里</div>';
                return;
            }

            historyList.forEach(item => {
                const itemEl = document.createElement('a');
                itemEl.className = 'follow-item';
                itemEl.href = item.url;
                itemEl.target = '_blank';
                itemEl.innerHTML = `
                    <div class="follow-item-name">${item.name}</div>
                    <div class="follow-item-desc">${item.desc}</div>
                `;
                listContainer.appendChild(itemEl);
            });
        }

        // ========== 4. 核心搜索逻辑 ==========
        function handleSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) return;

            const keywordLower = keyword.toLowerCase();
            let matchedItem = null;

            for (const key in keywordMap) {
                if (key.toLowerCase() === keywordLower) {
                    matchedItem = { ...keywordMap[key] };
                    break;
                }
            }

            if (!matchedItem) {
                alert('未找到对应内容，请输入正确的关键词');
                return;
            }

            // 去重后插入到最前面
            historyList = historyList.filter(item => item.url !== matchedItem.url);
            historyList.unshift(matchedItem);
            renderHistoryList();

            window.open(matchedItem.url, '_blank');
            searchInput.value = '';
        }

        // ========== 5. 绑定事件 ==========
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        clearBtn.addEventListener('click', function() {
            if (historyList.length === 0) {
                alert('暂无历史记录可清空');
                return;
            }
            if (confirm('确定要清空所有搜索历史记录吗？此操作不可恢复。')) {
                historyList = [];
                renderHistoryList();
            }
        });

        // ========== 6. 页面初始化 ==========
        renderHistoryList();
    </script>
</body>
</html>
