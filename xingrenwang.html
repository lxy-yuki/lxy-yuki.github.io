<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杏仁网 - 你的共享电子日记岛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        /* 页面整体布局 */
        body {
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ========== 左侧主内容区 ========== */
        .main-area {
            flex: 1;
            background-color: #ffe8a8;
            padding: 6% 8%;
            display: flex;
            flex-direction: column;
            gap: 8%;
            position: relative; /* 新增：作为图片区域的定位参照 */
        }

        /* ========== 顶部图片插入区域（可调整位置） ========== */
        .img-container {
            height: 200px;
            position: absolute; /* 修改：脱离文档流，不占用布局空间 */
            top: 0%; /* 与原顶部内边距对齐 */
            left: 120px; /* 与原左侧内边距对齐 */
            width: calc(100% - 16%); /* 与原内容区域宽度一致 */
        }

        .img-container img {
            position: absolute;
            top: 0px;
            left: 0px;
            height: 100%;
            width: auto;
        }

        /* ========== 搜索栏 ========== */
        .search-bar {
            width: 100%;
            height: 180px;
            background-color: #FFF1F1;
            border-radius: 45px;
            display: flex;
            align-items: center;
            padding: 0 35px;
            position: relative;
            margin-top: 150px; /* 新增：固定搜索栏的垂直位置，数值可微调 */
        }

        .search-input {
            flex: 1;
            height: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 24px;
            color: #887766;
            padding-right: 100px;
        }

        .search-input::placeholder {
            color: #d4c4b0;
        }

        /* ========== 搜索栏右侧图片（可调节位置与大小） ========== */
        .search-side-img {
            position: absolute;
            right: -45px;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            height: auto;
            pointer-events: none;
        }

        /* ========== 右侧边栏 ========== */
        .sidebar {
            width: 220px;
            background-color: #FFD9A8;
            padding: 80px 20px 30px; /* 底部增加内边距，避免按钮贴边 */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .sidebar-title {
            color: #ffffff;
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 2px;
            flex-shrink: 0;
        }

        /* 搜索记录列表容器：flex:1 自动撑开剩余空间，把按钮挤到最底部 */
        .follow-list {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* 清空历史按钮：固定在底部 */
        .clear-btn {
            width: 100%;
            padding: 10px 0;
            background-color: #FFE3C1;
            color: #8B6B3D;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            flex-shrink: 0; /* 禁止被压缩 */
        }

        .clear-btn:hover {
            background-color: #FFD6A8;
        }

        /* 列表项样式 */
        .follow-item {
            width: 100%;
            padding: 14px 16px;
            background-color: #FFE3C1;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: block;
        }

        .follow-item:hover {
            background-color: #FFD6A8;
            transform: translateX(-2px);
        }

        .follow-item-name {
            font-size: 16px;
            color: #8B6B3D;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .follow-item-desc {
            font-size: 12px;
            color: #B5956A;
            line-height: 1.4;
        }

        /* 空状态/无结果提示 */
        .empty-tip {
            text-align: center;
            color: #C4A47A;
            font-size: 14px;
            padding: 30px 0;
            line-height: 1.5;
        }

        /* 滚动条美化 */
        .follow-list::-webkit-scrollbar {
            width: 4px;
        }
        .follow-list::-webkit-scrollbar-thumb {
            background-color: #E8C694;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <!-- 左侧主内容 -->
    <div class="main-area">
        <!-- 顶部可调整位置的图片插入区 -->
        <div class="img-container">
            <img src="images/xingren5.png" alt="顶部自定义图片">
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="输入关键词搜索...">
            <!-- 搜索栏右侧自定义图片 -->
            <img class="search-side-img" src="images/xingren6.png" alt="右侧自定义图片">
        </div>
    </div>

    <!-- 右侧边栏：搜索历史记录 -->
    <div class="sidebar">
        <div class="sidebar-title">关注列表</div>
        <div class="follow-list" id="followList">
            <div class="empty-tip">搜索记录<br>将显示在这里</div>
        </div>
        <!-- 清空按钮移到列表下方，即侧边栏最底部 -->
        <button class="clear-btn" id="clearBtn">清空历史记录</button>
    </div>

    <script>
        // ========== 1. 自定义关键词映射表：按格式添加即可 ==========
        const keywordMap = {
            "陈树": {
                name: "陈树",
                desc: "苹果树",
                url: "socialaccount1.html"
            },
            "李挚圆": {
                name: "李挚圆",
                desc: "一枚圆子",
                url: "haiyangguan.html"
            },
            "刘真": {
                name: "刘真",
                desc: "最爱海豚",
                url: "Aquarium.html"
            },
            "赵雨虹": {
                name: "赵雨虹",
                desc: "雨后彩虹rainbow",
                url: "B-daily.html"
            },
            "张智": {
                name: "张智",
                desc: "海洋知识智慧哥哥",
                url: "nightcord-1.html"
            }
        };

        const listContainer = document.getElementById('followList');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const STORAGE_KEY = 'xingren_search_history';

        // ========== 2. 读取本地保存的搜索历史 ==========
        function getSearchHistory() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        // ========== 3. 保存搜索历史到本地 ==========
        function saveSearchHistory(list) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
            } catch (e) {
                console.warn('本地存储失败');
            }
        }

        // ========== 4. 渲染右侧列表 ==========
        function renderHistoryList() {
            const historyList = getSearchHistory();
            listContainer.innerHTML = '';

            if (historyList.length === 0) {
                listContainer.innerHTML = '<div class="empty-tip">搜索记录<br>将显示在这里</div>';
                return;
            }

            historyList.forEach(item => {
                const itemEl = document.createElement('a');
                itemEl.className = 'follow-item';
                itemEl.href = item.url;
                itemEl.target = '_blank';
                itemEl.innerHTML = `
                    <div class="follow-item-name">${item.name}</div>
                    <div class="follow-item-desc">${item.desc}</div>
                `;
                listContainer.appendChild(itemEl);
            });
        }

        // ========== 5. 核心搜索逻辑 ==========
        function handleSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) return;

            const keywordLower = keyword.toLowerCase();
            let matchedItem = null;

            for (const key in keywordMap) {
                if (key.toLowerCase() === keywordLower) {
                    matchedItem = { ...keywordMap[key] };
                    break;
                }
            }

            if (!matchedItem) {
                alert('未找到对应内容，请输入正确的关键词');
                return;
            }

            let historyList = getSearchHistory();
            historyList = historyList.filter(item => item.url !== matchedItem.url);
            historyList.unshift(matchedItem);
            saveSearchHistory(historyList);
            renderHistoryList();

            window.open(matchedItem.url, '_blank');
            searchInput.value = '';
        }

        // ========== 6. 绑定事件 ==========
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        clearBtn.addEventListener('click', function() {
            const historyList = getSearchHistory();
            if (historyList.length === 0) {
                alert('暂无历史记录可清空');
                return;
            }
            if (confirm('确定要清空所有搜索历史记录吗？此操作不可恢复。')) {
                localStorage.removeItem(STORAGE_KEY);
                renderHistoryList();
            }
        });

        // ========== 7. 页面初始化 ==========
        renderHistoryList();
    </script>
</body>
</html>
