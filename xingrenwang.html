<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杏仁网 - 你的共享电子日记岛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }

        /* 页面整体布局 */
        body {
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ========== 左侧主内容区 ========== */
        .main-area {
            flex: 1;
            background-color: #ffe8a8;
            padding: 6% 8%;
            display: flex;
            flex-direction: column;
            gap: 8%;
            position: relative;
        }

        /* ========== 顶部图片插入区域（可调整位置） ========== */
        .img-container {
            height: 200px;
            position: absolute;
            top: 5%;
            left: 80px;
            width: calc(100% - 16%);
        }

        .img-container img {
            position: absolute;
            top: 0px;
            left: 0px;
            height: 100%;
            width: auto;
        }

        /* ========== 搜索栏 ========== */
        .search-bar {
            width: 100%;
            height: 180px;
            background-color: #FFF1F1;
            border-radius: 45px;
            display: flex;
            align-items: center;
            padding: 0 35px;
            position: relative;
            margin-top: 150px;
        }

        .search-input {
            flex: 1;
            height: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 24px;
            color: #887766;
            padding-right: 100px;
        }

        .search-input::placeholder {
            color: #d4c4b0;
        }

        /* ========== 搜索栏右侧图片（可调节位置与大小） ========== */
        .search-side-img {
            position: absolute;
            right: -45px;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: auto;
            pointer-events: none;
        }

        /* ========== 右侧边栏 ========== */
        .sidebar {
            width: 220px;
            background-color: #FFD9A8;
            padding: 80px 20px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* ===== 关注列表标题 ===== */
        .sidebar-title {
            color: #ffffff;
            font-size: 21px;
            font-weight: 500;
            letter-spacing: 7px;
            flex-shrink: 0;
            height: 40px;
            line-height: 40px;
            text-align: center;
            width: 100%;
        }

        /* 搜索记录列表容器 */
        .follow-list {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* 清空历史按钮 */
        .clear-btn {
            width: 100%;
            padding: 10px 0;
            background-color: #FFE3C1;
            color: #8B6B3D;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            flex-shrink: 0;
        }

        .clear-btn:hover {
            background-color: #FFD6A8;
        }

        /* 列表项样式 */
        .follow-item {
            width: 100%;
            padding: 14px 16px;
            background-color: #FFE3C1;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: block;
        }

        .follow-item:hover {
            background-color: #FFD6A8;
            transform: translateX(-2px);
        }

        .follow-item-name {
            font-size: 16px;
            color: #8B6B3D;
            font-weight: 500;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .update-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef3434;
            box-shadow: 0 0 0 4px rgba(239,52,52,.13), 0 0 12px rgba(239,52,52,.65);
            animation: updatePulse 1.15s ease-in-out infinite alternate;
        }
        @keyframes updatePulse { to { transform: scale(1.22); } }

        .follow-item-desc {
            font-size: 12px;
            color: #B5956A;
            line-height: 1.4;
        }

        /* 空状态提示 */
        .empty-tip {
            text-align: center;
            color: #C4A47A;
            font-size: 14px;
            padding: 30px 0;
            line-height: 1.5;
        }

        /* 滚动条美化 */
        .follow-list::-webkit-scrollbar {
            width: 4px;
        }
        .follow-list::-webkit-scrollbar-thumb {
            background-color: #E8C694;
            border-radius: 2px;
        }

        /* ========== 首次打开提示弹窗（麦英基金会配色） ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(80, 50, 0, 0.38);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        /* 隐藏状态 */
        .modal-overlay.hidden {
            display: none;
        }

        .modal-box {
            width: 540px;
            max-width: 84vw;
            background: linear-gradient(to bottom, #ffeac5, #ffd49b);
            border: 3px solid #ff9900;
            border-radius: 28px;
            padding: 48px 46px 34px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
            box-shadow: 0 14px 44px rgba(160, 100, 10, 0.4);
            animation: modalPop 0.28s ease-out;
        }

        @keyframes modalPop {
            from { transform: scale(0.88); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }

        .modal-text {
            font-size: 19px;
            line-height: 1.95;
            color: #8B5A00;
            text-align: center;
            letter-spacing: 1px;
        }

        .modal-btn {
            padding: 13px 56px;
            background-color: #ff9900;
            color: #ffffff;
            border: none;
            border-radius: 32px;
            font-size: 18px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .modal-btn:hover {
            background-color: #e88a00;
        }

        .modal-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <!-- 左侧主内容 -->
    <div class="main-area">
        <div class="img-container">
            <img src="images/xingren5.png" alt="顶部自定义图片">
        </div>

        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="输入用户名搜索...">
            <img class="search-side-img" src="images2/mirror4.png" alt="右侧自定义图片">
        </div>
    </div>

    <!-- 右侧边栏：搜索历史记录 -->
    <div class="sidebar">
        <div class="sidebar-title">关注列表</div>
        <div class="follow-list" id="followList">
            <div class="empty-tip">搜索记录<br>将显示在这里</div>
        </div>
        <button class="clear-btn" id="clearBtn">清空历史记录</button>
    </div>

    <!-- ========== 首次打开提示弹窗 ========== -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal-box">
            <p class="modal-text">麦英基金会提醒您，您已进入内部社交软件，搜索过的人会自动关注并出现在右侧列表</p>
            <button class="modal-btn" id="modalBtn">我已知晓</button>
        </div>
    </div>

    <script src="ending-state.js"></script>
    <script>
        EndingState.markClue("14");
        // ========== 0. 关键词规范化 ==========
        // 去除所有空白字符（空格、Tab、换行等）及所有标点符号，并统一转为小写
        // 若还想忽略数学符号等，可将 \p{P} 改为 [\p{P}\p{S}]
        function normalizeKeyword(str) {
            return String(str)
                .toLowerCase()
                .replace(/[\s\p{P}]/gu, '');
        }

        // ========== 1. 自定义关键词映射表 ==========
        // 键统一由 normalizeKeyword 生成，因此天然忽略空格、标点及大小写差异
        const keywordMap = {
            [normalizeKeyword("陈树")]: {
                name: "陈树",
                desc: "苹果树",
                url: "socialaccount1.html"
            },
            [normalizeKeyword("苹果树")]: {
                name: "陈树",
                desc: "苹果树",
                url: "socialaccount1.html"
            },
            [normalizeKeyword("李挚圆")]: {
                name: "李挚圆",
                desc: "一枚圆子",
                url: "socialaccount-yuan.html"
            },
            [normalizeKeyword("一枚圆子")]: {
                name: "李挚圆",
                desc: "一枚圆子",
                url: "socialaccount-yuan.html"
            },
            [normalizeKeyword("刘真")]: {
                name: "刘真",
                desc: "最爱海豚",
                url: "socialaccount-lz.html"
            },
            [normalizeKeyword("最爱海豚")]: {
                name: "刘真",
                desc: "最爱海豚",
                url: "socialaccount-lz.html"
            },
            [normalizeKeyword("赵雨虹")]: {
                name: "赵雨虹",
                desc: "雨后彩虹rainbow",
                url: "socialaccount2.html"
            },
            [normalizeKeyword("雨后彩虹rainbow")]: {
                name: "赵雨虹",
                desc: "雨后彩虹rainbow",
                url: "socialaccount2.html"
            },
            [normalizeKeyword("张智")]: {
                name: "张智",
                desc: "海洋知识智慧哥哥",
                url: "socialaccount-zhangz.html"
            },
            [normalizeKeyword("海洋知识智慧哥哥")]: {
                name: "张智",
                desc: "海洋知识智慧哥哥",
                url: "socialaccount-zhangz.html"
            },
            [normalizeKeyword("钱蔚东")]: {
                name: "钱蔚东",
                desc: "IM a changed man.",
                url: "socialaccount3.html"
            },
            [normalizeKeyword("IM a changed man.")]: {
                name: "钱蔚东",
                desc: "IM a changed man.",
                url: "socialaccount3.html"
            },
            [normalizeKeyword("有需要，找小周")]: {
                name: "周伟",
                desc: "有需要，找小周.",
                url: "socialaccount-zw.html"
            },
            [normalizeKeyword("周伟")]: {
                name: "周伟",
                desc: "有需要，找小周.",
                url: "socialaccount-zw.html"
            }
        };

        const listContainer = document.getElementById('followList');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');

        // ========== 2. 使用 localStorage 持久保存关注列表 ==========
        const FOLLOW_HISTORY_KEY = 'maiying.xingren.followHistory.v1';
        function loadHistoryList() {
            try {
                const saved = JSON.parse(localStorage.getItem(FOLLOW_HISTORY_KEY) || '[]');
                return Array.isArray(saved) ? saved : [];
            } catch (e) {
                return [];
            }
        }
        function saveHistoryList() {
            try { localStorage.setItem(FOLLOW_HISTORY_KEY, JSON.stringify(historyList)); } catch (e) { /* 忽略 */ }
        }
        let historyList = loadHistoryList();

        // ========== 3. 渲染右侧列表 ==========
        function renderHistoryList() {
            listContainer.innerHTML = '';

            if (historyList.length === 0) {
                listContainer.innerHTML = '<div class="empty-tip">搜索记录<br>将显示在这里</div>';
                return;
            }

            const endingState = window.EndingState ? EndingState.getEnding() : {};
            historyList.forEach(item => {
                const itemEl = document.createElement('a');
                itemEl.className = 'follow-item';
                const isChenUpdate = item.name === '陈树' && endingState.chenUpdateUnread;
                itemEl.href = isChenUpdate ? 'socialaccount1.html?ending=1' : item.url;
                itemEl.target = isChenUpdate ? '_self' : '_blank';
                itemEl.innerHTML = `
                    <div class="follow-item-name">${item.name}${isChenUpdate ? '<span class="update-dot" title="有新动态"></span>' : ''}</div>
                    <div class="follow-item-desc">${item.desc}</div>
                `;
                if (isChenUpdate) {
                    itemEl.addEventListener('click', function () {
                        EndingState.updateEnding({ chenUpdateUnread: false });
                    });
                }
                listContainer.appendChild(itemEl);
            });
        }

        // ========== 4. 核心搜索逻辑 ==========
        function handleSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) return;

            // 规范化用户输入：忽略空格、标点、大小写
            const normalizedKeyword = normalizeKeyword(keyword);

            // 直接以规范化后的字符串作为键查表
            const matched = keywordMap[normalizedKeyword];

            if (!matched) {
                alert('未找到对应内容，请输入正确的关键词');
                return;
            }

            const matchedItem = { ...matched };

            // 去重后插入到最前面
            historyList = historyList.filter(item => item.url !== matchedItem.url);
            historyList.unshift(matchedItem);
            saveHistoryList();
            renderHistoryList();

            window.open(matchedItem.url, '_blank');
            searchInput.value = '';
        }

        // ========== 5. 绑定事件 ==========
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        clearBtn.addEventListener('click', function() {
            if (historyList.length === 0) {
                alert('暂无历史记录可清空');
                return;
            }
            if (confirm('确定要清空所有搜索历史记录吗？此操作不可恢复。')) {
                historyList = [];
                saveHistoryList();
                renderHistoryList();
            }
        });

        // ========== 6. 页面初始化 ==========
        if (new URLSearchParams(window.location.search).get('endingUpdate') === '1') {
            const chen = keywordMap[normalizeKeyword('陈树')];
            if (chen && !historyList.some(item => item.url === chen.url)) {
                historyList.unshift({ ...chen });
                saveHistoryList();
            }
        }
        renderHistoryList();

        // ========== 7. 首次打开提示弹窗 ==========
        const modalOverlay = document.getElementById('modalOverlay');
        const modalBtn = document.getElementById('modalBtn');

        // 读取 / 写入"是否已提示过"的标记（用 try-catch 防止部分环境禁用 localStorage 时报错）
        function hasShownNotice() {
            try {
                return localStorage.getItem('maiyingNoticeShown') === '1';
            } catch (e) {
                return false;
            }
        }
        function markNoticeShown() {
            try {
                localStorage.setItem('maiyingNoticeShown', '1');
            } catch (e) {
                /* 忽略写入失败 */
            }
        }

        // 如果之前没有提示过，则显示弹窗
        if (!hasShownNotice()) {
            modalOverlay.classList.remove('hidden');
        }

        // 点击"我已知晓"按钮关闭弹窗，并记录已提示
        modalBtn.addEventListener('click', function() {
            modalOverlay.classList.add('hidden');
            markNoticeShown();
        });
    </script>
</body>
</html>
