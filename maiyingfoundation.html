<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金会官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", serif;
        }
        body {
            display: flex;
            min-height: 100vh;
            background: #ffffff;
        }

        /* ========== 左侧主区域 ========== */
        .left-area {
            flex: 1;
            padding: 60px 70px;
            display: flex;
            flex-direction: column;
        }

        /* 【核心可调】Logo图片：可修改宽高、边距、与搜索栏的距离 */
        .foundation-logo {
            width: 400px;          /* 图片宽度 */
            height: auto;          /* 高度自适应，保持比例 */
            margin-top: -60px;      /* 距离页面顶部距离 */
            margin-left: 0px;      /* 距离页面左侧距离 */
            margin-bottom: -30px;   /* 控制图片与搜索栏的垂直距离 */
        }

        /* 搜索栏容器 */
        .search-box {
            width: 100%;
            max-width: 620px;
        }
        .search-bar {
            width: 100%;
            height: 62px;
            background-color: #ffb64d;
            border-radius: 31px;
            display: flex;
            align-items: center;
            padding: 0 22px;
        }
        .search-icon {
            font-size: 26px;
            color: #fff;
            margin-right: 14px;
        }
        .search-input {
            flex: 1;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 17px;
            color: white;
        }
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ========== 右侧侧边栏 ========== */
        .right-sidebar {
            width: 290px;
            background: linear-gradient(to bottom, #ffeac5, #ffd49b);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 65px 20px 30px;
            min-height: 100vh;
        }

        /* 头像区域 */
        .user-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .user-avatar {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-avatar svg {
            width: 42px;
            height: 42px;
            fill: #d1d1d1;
        }
        .visitor-text {
            font-size: 19px;
            color: #868686;
            letter-spacing: 2px;
        }

        /* 按钮区域 */
        .btn-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 10px;
            flex-grow: 1;
            justify-content: space-between;
        }
        /* 搜索历史按钮 */
        .search-history-btn {
            padding: 11px 32px;
            border: 1px solid #ff9900;
            background: white;
            color: #ff9900;
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-history-btn::after {
            content: "➤";
            font-size: 22px;
        }
        /* 调查结束按钮 */
        .end-survey-btn {
            padding: 16px 42px;
            background-color: #ff9900;
            color: white;
            border: none;
            border-radius: 32px;
            font-size: 19px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 左侧：Logo + 搜索栏 -->
    <div class="left-area">
        <img class="foundation-logo" src=".\images\logo1.png" alt="基金会Logo">

        <!-- 搜索栏 -->
        <div class="search-box">
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="searchInput" placeholder="输入关键词搜索...">
            </div>
        </div>
    </div>

    <!-- 右侧：头像 + 按钮 -->
    <div class="right-sidebar">
        <div class="user-zone">
            <div class="user-avatar">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <div class="visitor-text">VISITOR</div>
        </div>

        <div class="btn-zone">
            <button class="search-history-btn" id="historyBtn">搜索历史</button>
            <button class="end-survey-btn" id="endBtn">调查结束</button>
        </div>
    </div>

    <script>
        // 搜索框回车触发（无弹窗，直接跳转）
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const keyword = this.value.trim();
                if (keyword === "海洋馆") {
                    window.location.href = "mid/middle1.html";
                } else if (keyword === "陈树1999") {
                    window.location.href = "mid/middle2.html";
                } else {
                    window.location.href = "mid/middle404.html";
                }
            }
        });

        // 🔴 搜索历史按钮：点击直接跳转页面（自行填写链接）
        document.getElementById('historyBtn').addEventListener('click', () => {
            window.location.href = "搜索历史页面链接";
        });
        
        // 🔴 调查结束按钮：修改为指定弹窗内容
        document.getElementById('endBtn').addEventListener('click', () => {
            alert("亲爱的调查员，你还有很多工作要做，还不能休息哦");
        });
    </script>
</body>
</html>
