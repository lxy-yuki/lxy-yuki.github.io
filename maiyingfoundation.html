<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金会官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", serif;
        }
        body {
            display: flex;
            min-height: 100vh;
            background: #ffffff;
        }

        /* ========== 左侧主区域 ========== */
        .left-area {
            flex: 1;
            padding: 60px 70px;
            display: flex;
            flex-direction: column;
        }

        /* Logo图片 */
        .foundation-logo {
            width: 400px;
            height: auto;
            margin-top: -60px;
            margin-left: 0px;
            margin-bottom: -30px;
        }

        /* 搜索栏容器 */
        .search-box {
            width: 100%;
            max-width: 620px;
        }
        .search-bar {
            width: 100%;
            height: 62px;
            background-color: #ffb64d;
            border-radius: 31px;
            display: flex;
            align-items: center;
            padding: 0 22px;
        }

        /* 搜索栏左侧图片图标 */
        .search-icon-img {
            width: 28px;
            height: 28px;
            margin-right: 14px;
            margin-left: 0px;
            object-fit: contain;
            vertical-align: middle;
            position: relative;
            top: 0px;
        }

        .search-input {
            flex: 1;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 17px;
            color: white;
        }
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ========== 右侧侧边栏 ========== */
        .right-sidebar {
            width: 290px;
            background: linear-gradient(to bottom, #ffeac5, #ffd49b);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 65px 20px 30px;
            min-height: 100vh;
        }

        /* 头像区域 */
        .user-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .user-avatar {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-avatar svg {
            width: 42px;
            height: 42px;
            fill: #d1d1d1;
        }
        .visitor-text {
            font-size: 19px;
            color: #868686;
            letter-spacing: 2px;
        }

        /* 按钮区域 */
        .btn-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 10px;
            flex-grow: 1;
            justify-content: space-between;
        }
        .search-history-btn {
            padding: 11px 32px;
            border: 1px solid #ff9900;
            background: white;
            color: #ff9900;
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-history-btn::after {
            content: "➤";
            font-size: 22px;
        }
        .end-survey-btn {
            padding: 16px 42px;
            background-color: #ff9900;
            color: white;
            border: none;
            border-radius: 32px;
            font-size: 19px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 左侧：Logo + 搜索栏 -->
    <div class="left-area">
        <img class="foundation-logo" src=".\images\logo1.png" alt="基金会Logo">

        <!-- 搜索栏 -->
        <div class="search-box">
            <div class="search-bar">
                <img class="search-icon-img" src=".\images\mirror1.png" alt="搜索图标">
                <input type="text" class="search-input" id="searchInput" placeholder="输入关键词搜索...">
            </div>
        </div>
    </div>

    <!-- 右侧：头像 + 按钮 -->
    <div class="right-sidebar">
        <div class="user-zone">
            <div class="user-avatar">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <div class="visitor-text">VISITOR</div>
        </div>

        <div class="btn-zone">
            <button class="search-history-btn" id="historyBtn">搜索历史</button>
            <button class="end-survey-btn" id="endBtn">调查结束</button>
        </div>
    </div>

    <script>
        // 搜索框回车触发：在新标签页打开搜索结果，并携带 keyword 参数
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const keyword = this.value.trim();
                // 对所有关键词统一处理：新窗口打开对应页面，并带上 keyword 参数
                let targetPage = "";
                if (keyword === "泊然海洋馆") {
                    targetPage = "mid/middle-Aquarium.html";
                } else if (keyword === "陈树1999") {
                    targetPage = "mid/middle-chenshu.html";
                } else if (keyword === "MT集团") {
                    targetPage = "mid/middle-MT.html";
                } else if (keyword === "海洋馆溺亡美人鱼案") {
                    targetPage = "mid/middle-die.html";
                } else if (keyword === "安伯然") {
                    targetPage = "mid/middle-boran.html";
                } else if (keyword === "泊然集团") {
                    targetPage = "mid/middle-brcpny.html";
                } else if (keyword === "安仲斌") {
                    targetPage = "mid/middle-azb.html";
                } else if (keyword === "安永德") {
                    targetPage = "mid/middle-ayd.html";
                } else if (keyword === "贾剑明") {
                    targetPage = "mid/middle-jjm.html";
                } else if (keyword === "明通集团") {
                    targetPage = "mid/middle-mtjt.html";
                } else if (keyword === "杏仁网") {
                    targetPage = "mid/middle-xingren.html";
                } else if (keyword === "蔚蓝传媒") {
                    targetPage = "mid/middle-bluemedia.html";
                } else if (keyword === "钱宏达") {
                    targetPage = "mid/middle-qhd.html";
                } else if (keyword === "蓝鲸贸易") {
                    targetPage = "mid/middle-bluewhale.html";
                } else if (keyword === "劳而得") {
                    targetPage = "mid/middle-labor.html";
                } else if (keyword === "海洋馆保安拾金不昧") {
                    targetPage = "mid/middle-jinqi.html";
                } else if (keyword === "B2025-JD-0718") {
                    targetPage = "mid/middle-juanzong1.html";
                } else if (keyword === "B2025-JD-0717") {
                    targetPage = "mid/middle-warning.html";
                } else if (keyword === "临时工溺亡") {
                    targetPage = "mid/middle-linshi.html";
                } else {
                    targetPage = "mid/middle404.html";
                }
                // 使用 window.open 在新标签页打开，并在 URL 后附带 keyword 参数
                window.open(targetPage + "?keyword=" + encodeURIComponent(keyword), "_blank");
            }
        });

        // 搜索历史按钮：点击直接跳转页面（原逻辑不变）
        document.getElementById('historyBtn').addEventListener('click', () => {
            window.location.href = "搜索历史页面链接";
        });

        // 调查结束按钮：弹窗（原逻辑不变）
        document.getElementById('endBtn').addEventListener('click', () => {
            alert("亲爱的调查员，你还有很多工作要做，还不能休息哦");
        });
    </script>
</body>
</html>
