<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交账号主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
            text-decoration: none;
        }
        body {
            background-color: #FF7F84;
            display: flex;
            padding: 40px 40px 40px 40px;
            gap: 32px;
            height: 100vh;
            overflow: hidden;
            align-items: flex-start;
        }
        .left-container {
            width: 260px;
            background-color: #FFF0F0;
            border-radius: 24px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            height: calc(100vh - 40px - 20px);
        }
        .avatar-wrap {
            display: flex;
            justify-content: center;
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-image: url('images2/zhouwei-0.jpg');
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .avatar:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
        .btn-wrap {
            display: flex;
            justify-content: center;
        }
        .btn {
            width: 90%;
            height: 36px;
            border-radius: 18px;
            background-color: #FFB6B9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .btn.active {
            background-color: #FF7F84;
            font-weight: bold;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .intro-wrap {
            flex-grow: 1;
        }
        .intro-content {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            background-color: #FFB6B9;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;  /* 新增：垂直排列 */
            align-items: center;
            justify-content: center;
            color: #ffffff;
            gap: 8px;                /* 新增：行间距 */
            line-height: 1.6;
            text-align: center;
        }
        .intro-content p {
            margin: 0;               /* 新增：去除段落外边距 */
        }
        .main-page {
            flex: 1;
            background-color: #FFF0F0;
            border-radius: 24px;
            padding: 40px;
            height: calc(100vh - 40px - 20px);
        }
        .content {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background-color: #FFFFFF;
            padding: 30px;
            font-size: 16px;
            color: #666;
            display: none;
            overflow-y: auto;
        }
        .content.active {
            display: block;
        }

        .content-title {
            font-size: 22px;
            color: #FF7F84;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }
        .post-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .post-item {
            background-color: #fdf6f7;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #FFE0E2;
        }
        .post-content {
            line-height: 1.8;
            color: #555;
            margin-bottom: 15px;
        }
        .post-img {
            width: 100%;
            max-width: 300px;
            border-radius: 12px;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .post-footer {
            color: #FF7F84;
            font-weight: bold;
            font-size: 14px;
        }
        .post-time {
            font-size: 14px;
            color: #999;
            margin-bottom: 12px;
        }
        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .post-header-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #FFB6B9;
            background-image: url('images2/zhaoyuhong-0.jpg');
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .post-header-avatar:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
        .post-header-name {
            font-size: 15px;
            color: #FF7F84;
            font-weight: bold;
        }
        .content-section {
            position: relative;
        }
        .sort-btn {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #FFB6B9;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .sort-btn:hover {
            background-color: #FF7F84;
        }

        .comment-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #FFE0E2;
        }
        .comment-title {
            font-size: 14px;
            color: #FF7F84;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .comment-item {
            display: flex;
            gap: 10px;
        }
        /* 评论头像：圆形裁剪 + 可点击 */
        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #FFB6B9;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.2s;
        }
        .comment-avatar:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
        .comment-body {
            flex: 1;
        }
        .comment-name {
            font-size: 13px;
            color: #FF7F84;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .comment-text {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }
        .comment-time {
            font-size: 12px;
            color: #bbb;
            margin-top: 3px;
        }
        .reply-name {
            color: #FF7F84;
            font-weight: bold;
        }

        .file-content-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .file-section {
            display: none;
            width: 100%;
            height: 100%;
        }
        .file-section.active {
            display: block;
        }
        .file-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: minmax(220px, auto);
            gap: 25px;
            min-height: 480px;
        }
        .folder-card {
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            padding: 20px;
        }
        .folder-normal {
            background-color: #FFF0F0;
        }
        .folder-secret {
            background-color: #FFB6B9;
        }
        .folder-card:hover {
            transform: scale(1.03);
        }
        .folder-key {
            font-size: 48px;
            color: #333;
            margin-bottom: 10px;
        }
        .folder-name {
            font-size: 16px;
            color: #555;
            font-weight: 500;
            text-align: center;
        }

        .back-btn {
            background-color: #FFB6B9;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn:hover {
            background-color: #FF7F84;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .image-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .image-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #FFE0E2;
        }
        .image-caption {
            text-align: center;
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            padding: 0 5px;
        }
        .doc-item {
            background-color: #fdf6f7;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #FFE0E2;
        }
        .doc-detail {
            margin-top: 8px;
            font-size: 14px;
            color: #888;
            line-height: 1.6;
            padding-left: 5px;
        }
        .doc-title {
            font-size: 16px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 10px;
        }
        .doc-detail {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-box {
            width: 380px;
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .modal-title {
            font-size: 20px;
            color: #FF7F84;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .modal-input {
            width: 100%;
            height: 40px;
            border: 1px solid #FFB6B9;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 15px;
            outline: none;
            margin-bottom: 25px;
        }
        .modal-btn-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-btn {
            width: 100px;
            height: 38px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }
        .modal-btn-back {
            background: #FFB6B9;
            color: #fff;
        }
        .modal-btn-confirm {
            background: #FF7F84;
            color: #fff;
        }
        .modal-btn:hover {
            opacity: 0.9;
        }

        #avatarModal {
            cursor: pointer;
        }
        #avatarModal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            object-fit: contain;
            cursor: default;
            transition: transform 0.2s;
        }
        #avatarModal img:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <!-- 左侧栏 -->
    <div class="left-container">
        <div class="avatar-wrap">
            <div class="avatar" onclick="openAvatarModal('images2/zhouwei-0.jpg')" title="点击查看完整头像"></div>
        </div>

        <div class="btn-wrap">
            <button class="btn active" onclick="switchTab('home')">我的主页</button>
        </div>

        <div class="btn-wrap">
            <button class="btn" onclick="switchTab('file')">我的文件</button>
        </div>

        <div class="intro-wrap">
            <div class="intro-content">
                男/1998年
                <p>我是周伟，伟大的伟</p>
            </div>
        </div>
    </div>

    <!-- 右侧内容区域 -->
    <div class="main-page">
        <div id="home" class="content active">
            <div class="content-area">
                <div class="content-section">
                    <div class="content-title">有需要，找小周的动态</div>
                    <button id="sortBtn" class="sort-btn">切换正序</button>
                    <div class="post-list" id="postList">
                        
                    </div>
                </div>
            </div>
        </div>

    <!-- 我的文件 -->
    <div id="file" class="content">
        <div class="file-content-container">
            <div id="file-main" class="file-section active">
                <h3 style="color: #FF7F84; margin-bottom:20px;">📁 我的文件总览</h3>
            </div>
        </div>
    </div>

    <!-- 密码弹窗 -->
    <div class="modal-overlay" id="pwdModal">
        <div class="modal-box">
            <div class="modal-title">此处存在谜题</div>
            <input type="text" class="modal-input" id="pwdInput" placeholder="请输入密码">
            <div class="modal-btn-group">
                <button class="modal-btn modal-btn-back" onclick="closePwdModal()">返回</button>
                <button class="modal-btn modal-btn-confirm" onclick="checkPassword()">确认</button>
            </div>
        </div>
    </div>

    <!-- 头像预览模态框 -->
    <div class="modal-overlay" id="avatarModal" onclick="closeAvatarModal()">
        <img src="images2/zhouwei-0.jpg" alt="完整头像" onclick="event.stopPropagation()">
    </div>

    <script>
        const pwdConfig = {
            medical: "juyuan999",
            contract: "nnksaigao"
        };
        let currentTarget = "";

        function switchTab(tabName) {
            document.querySelectorAll('.content').forEach(item => item.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function switchFileSection(sectionName) {
            document.querySelectorAll('.file-section').forEach(section => section.classList.remove('active'));
            document.getElementById('file-' + sectionName).classList.add('active');
        }

        function openPwdModal(target) {
            currentTarget = target;
            document.getElementById('pwdModal').style.display = 'flex';
            document.getElementById('pwdInput').value = "";
            document.getElementById('pwdInput').focus();
        }

        function closePwdModal() {
            document.getElementById('pwdModal').style.display = 'none';
        }

        function checkPassword() {
            const inputVal = document.getElementById('pwdInput').value.trim();
            const rightPwd = pwdConfig[currentTarget];
            if(inputVal === rightPwd){
                closePwdModal();
                switchFileSection(currentTarget);
            }else{
                alert("密码错误");
            }
        }

        document.getElementById('pwdInput').addEventListener('keydown', function(e) {
            if(e.key === 'Enter') {
                checkPassword();
            }
        });

        // 头像预览函数（支持动态设置图片路径）
        function openAvatarModal(imageSrc) {
            document.getElementById('avatarModal').style.display = 'flex';
            document.getElementById('avatarModal').querySelector('img').src = imageSrc;
        }
        function closeAvatarModal() {
            document.getElementById('avatarModal').style.display = 'none';
        }

        // 动态排序
        const sortBtn = document.getElementById('sortBtn');
        const postList = document.getElementById('postList');
        let isDescOrder = true;
        sortBtn.addEventListener('click', function() {
            const posts = Array.from(postList.children);
            posts.reverse();
            posts.forEach(post => postList.appendChild(post));
            isDescOrder = !isDescOrder;
            sortBtn.textContent = isDescOrder ? '切换正序' : '切换倒序';
        });
    </script>
</body>
</html>
