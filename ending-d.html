<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>结局-新世界的起点</title><link rel="stylesheet" href="ending-ocean.css">
</head>
<body class="ending-ocean ending-result-c" data-ending-fish="C">
    <main class="ending-scene"><div class="ending-kicker">新世界的起点</div><div class="story-lines" id="story"></div><div class="continue-hint" id="hint">点击页面继续</div><div class="ending-actions" id="actions" hidden></div></main>
    <script src="ending-state.js"></script>
    <script src="ending-fish.js"></script>
    <script>
        (function(){
            var lines=[
                '在那之后，你回归了平凡的日常生活。你无法登陆那个橙色的基金会页面了，但对你来说，发生的一切都产生了意义，你想你一辈子都不会忘记。因为你的搜查和报案，陈苹获得了救助。过去发生的一切对她产生了一些阴影，但据社会福利院的人说，她的情况正慢慢变好，也进入了特殊学校读书。你每个月会资助她一点钱，福利院的人会拍点视频给你。她长高了，还是扎着苹果头，语言功能在慢慢恢复。你不知道自己到底希不希望她意识到曾经究竟发生了什么，但你知道就算她想起来也没关系。因为即使苹果核再瘦小，只要有人细心呵护照料，总有一天那枚小小的核会长成健壮的大树。',
                '麦英基金会最终买下了泊然海洋馆。你有一天深夜接到一封充满了抱怨的邮件，埋怨你推荐购入的海洋馆是个烂摊子，收拾起来要费太大的力气。但最终，在几年以后，那栋建筑第三次翻新重生。动物表演被取消了，很多你在网页上搜索过的员工还在那里。有人在网上吐槽海洋馆没有表演看个什么劲，但很快就被淹没在赞成取消表演的呼声里。某个假期，你去参观，看见穿着救生衣的小朋友像一群小丑鱼一样从你身边跑过。波光粼粼的地面上，新的梦想正在孕育。'
            ];
            var story=document.getElementById('story'),actions=document.getElementById('actions'),hint=document.getElementById('hint'),i=0,done=false;
            function add(v){var p=document.createElement('p');p.className='story-line';p.textContent=v;story.appendChild(p);story.scrollTo({top:story.scrollHeight,behavior:'smooth'})}
            function finish(){if(done)return;done=true;hint.hidden=true;actions.hidden=false;var button=document.createElement('button');button.className='ending-button';button.textContent='最后，您收到了麦英基金会的一封感谢信';button.addEventListener('click',function(e){e.stopPropagation();location.href='foundation-thanks.html'});actions.appendChild(button)}
            function advance(e){if((e&&e.target&&e.target.closest('button'))||document.body.classList.contains('fish-intro-active'))return;if(i<lines.length)add(lines[i++]);else finish()}
            function begin(){setTimeout(function(){add(lines[i++])},250)}if(document.body.classList.contains('fish-intro-active'))window.addEventListener('fishIntroComplete',begin,{once:true});else begin();document.body.addEventListener('click',advance);document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();advance()}});
        })();
    </script>
</body>
</html>
