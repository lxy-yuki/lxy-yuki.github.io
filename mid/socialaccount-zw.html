<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交账号主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
            text-decoration: none;
        }
        body {
            background-color: #FF7F84;
            display: flex;
            padding: 40px;
            gap: 32px;
            height: 100vh;
            overflow: hidden;
            align-items: flex-start;
        }
        .left-container {
            width: 260px;
            background-color: #FFF0F0;
            border-radius: 24px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            height: calc(100vh - 60px);
        }
        .avatar-wrap {
            display: flex;
            justify-content: center;
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-image: url('images2/zhouwei-0.jpg');
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .avatar:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
        .btn-wrap {
            display: flex;
            justify-content: center;
        }
        .btn {
            width: 90%;
            height: 36px;
            border-radius: 18px;
            background-color: #FFB6B9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .btn.active {
            background-color: #FF7F84;
            font-weight: bold;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .intro-wrap {
            flex-grow: 1;
        }
        .intro-content {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            background-color: #FFB6B9;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            gap: 8px;
            line-height: 1.6;
            text-align: center;
        }
        .intro-content p {
            margin: 0;
        }
        .main-page {
            flex: 1;
            background-color: #FFF0F0;
            border-radius: 24px;
            padding: 40px;
            height: calc(100vh - 60px);
        }
        .content {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background-color: #fff;
            padding: 30px;
            font-size: 16px;
            color: #666;
            display: none;
            overflow-y: auto;
        }
        .content.active {
            display: block;
        }
        .content-title {
            font-size: 22px;
            color: #FF7F84;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }
        .content-section {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .sort-btn {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #FFB6B9;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .sort-btn:hover {
            background-color: #FF7F84;
        }
        .empty-placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #999;
            letter-spacing: 2px;
        }
        .file-content-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .file-section {
            display: none;
            width: 100%;
            height: 100%;
        }
        .file-section.active {
            display: block;
        }
        #file-main {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        #file-main .empty-placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #999;
            letter-spacing: 2px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #avatarModal {
            cursor: pointer;
        }
        #avatarModal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            object-fit: contain;
            cursor: default;
            transition: transform 0.2s;
        }
        #avatarModal img:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <!-- 左侧栏 -->
    <div class="left-container">
        <div class="avatar-wrap">
            <div class="avatar" onclick="openAvatarModal('images2/zhouwei-0.jpg')" title="点击查看完整头像"></div>
        </div>

        <div class="btn-wrap">
            <button class="btn active" onclick="switchTab('home')">我的主页</button>
        </div>

        <div class="btn-wrap">
            <button class="btn" onclick="switchTab('file')">我的文件</button>
        </div>

        <div class="intro-wrap">
            <div class="intro-content">
                男/1998年
                <p>我是周伟，伟大的伟</p>
            </div>
        </div>
    </div>

    <!-- 右侧内容区域 -->
    <div class="main-page">
        <!-- 我的主页 -->
        <div id="home" class="content active">
            <div class="content-section">
                <div class="content-title">有需要，找小周的动态</div>
                <button id="sortBtn" class="sort-btn">切换正序</button>
                <div class="post-list" id="postList"></div>
                <div class="empty-placeholder">以下空白</div>
            </div>
        </div>

        <!-- 我的文件 -->
        <div id="file" class="content">
            <div class="file-content-container">
                <div id="file-main" class="file-section active">
                    <h3 style="color: #FF7F84; margin-bottom:20px;">📁 我的文件总览</h3>
                    <div class="empty-placeholder">以下空白</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 头像预览模态框 -->
    <div class="modal-overlay" id="avatarModal" onclick="closeAvatarModal()">
        <img src="images2/zhouwei-0.jpg" alt="完整头像" onclick="event.stopPropagation()">
    </div>

    <script>
        // 切换主页面
        function switchTab(tabName) {
            document.querySelectorAll('.content').forEach(item => item.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // 头像预览
        function openAvatarModal(imageSrc) {
            document.getElementById('avatarModal').style.display = 'flex';
            document.getElementById('avatarModal').querySelector('img').src = imageSrc;
        }
        function closeAvatarModal() {
            document.getElementById('avatarModal').style.display = 'none';
        }

        // 动态排序（列表为空时仅切换按钮文字）
        const sortBtn = document.getElementById('sortBtn');
        const postList = document.getElementById('postList');
        if (sortBtn && postList) {
            let isDescOrder = true;
            sortBtn.addEventListener('click', function() {
                const posts = Array.from(postList.children);
                posts.reverse();
                posts.forEach(post => postList.appendChild(post));
                isDescOrder = !isDescOrder;
                sortBtn.textContent = isDescOrder ? '切换正序' : '切换倒序';
            });
        }
    </script>
<script src="ending-state.js"></script><script>EndingState.markAccount("zhouwei");</script>
</body>
</html>
