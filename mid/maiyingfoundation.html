<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金会官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", serif;
        }
        body {
            display: flex;
            min-height: 100vh;
            background: #ffffff;
        }

        /* ========== 左侧主区域 ========== */
        .left-area {
            flex: 1;
            padding: 60px 70px;
            display: flex;
            flex-direction: column;
        }

        /* Logo图片 */
        .foundation-logo {
            width: 400px;
            height: auto;
            margin-top: -60px;
            margin-left: 0px;
            margin-bottom: -30px;
        }

        /* 搜索栏容器 */
        .search-box {
            width: 100%;
            max-width: 620px;
        }
        .search-bar {
            width: 100%;
            height: 62px;
            background-color: #ffb64d;
            border-radius: 31px;
            display: flex;
            align-items: center;
            padding: 0 22px;
        }

        /* 搜索栏左侧图片图标 */
        .search-icon-img {
            width: 28px;
            height: 28px;
            margin-right: 14px;
            margin-left: 0px;
            object-fit: contain;
            vertical-align: middle;
            position: relative;
            top: 0px;
        }

        .search-input {
            flex: 1;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 17px;
            color: white;
        }
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ========== 右侧侧边栏 ========== */
        .right-sidebar {
            width: 290px;
            background: linear-gradient(to bottom, #ffeac5, #ffd49b);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 65px 20px 30px;
            min-height: 100vh;
        }

        /* 头像区域 */
        .user-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .user-avatar {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-avatar svg {
            width: 42px;
            height: 42px;
            fill: #d1d1d1;
        }
        .visitor-text {
            font-size: 19px;
            color: #868686;
            letter-spacing: 2px;
        }

        /* 按钮区域 */
        .btn-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 10px;
            flex-grow: 1;
            justify-content: space-between;
        }
        .search-history-btn {
            padding: 11px 32px;
            border: 1px solid #ff9900;
            background: white;
            color: #ff9900;
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-history-btn::after {
            content: "➤";
            font-size: 22px;
        }
        .end-survey-btn {
            padding: 16px 42px;
            background-color: #ff9900;
            color: white;
            border: none;
            border-radius: 32px;
            font-size: 19px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 左侧：Logo + 搜索栏 -->
    <div class="left-area">
        <img class="foundation-logo" src=".\images\logo1.png" alt="基金会Logo">

        <!-- 搜索栏 -->
        <div class="search-box">
            <div class="search-bar">
                <img class="search-icon-img" src=".\images\mirror1.png" alt="搜索图标">
                <input type="text" class="search-input" id="searchInput" placeholder="输入关键词搜索...">
            </div>
        </div>
    </div>

    <!-- 右侧：头像 + 按钮 -->
    <div class="right-sidebar">
        <div class="user-zone">
            <div class="user-avatar">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <div class="visitor-text">VISITOR</div>
        </div>

        <div class="btn-zone">
            <button class="search-history-btn" id="historyBtn">搜索历史</button>
            <button class="end-survey-btn" id="endBtn">调查结束</button>
        </div>
    </div>

    <script src="ending-state.js"></script>
    <script>
        // ========== 关键词规范化 ==========
        // 去除所有空白字符（空格、Tab、换行等）及所有标点符号，并统一转为小写
        // 若还想忽略数学符号等，可将 \p{P} 改为 [\p{P}\p{S}]
        function normalizeKeyword(str) {
            return String(str)
                .toLowerCase()
                .replace(/[\s\p{P}]/gu, '');
        }

        const HISTORY_KEY = "maiying.foundation.researchHistory.v1";

        // 每一项描述一个可被搜索发现的 middle 结果页，以及该页中可直达的线索网页。
        // sequence 来自《海洋馆募捐调查委托 （序号版）》的“基金会搜索引擎”工作表。
        const searchCatalog = [
            {
                keyword: "海洋馆溺亡美人鱼案",
                aliases: ["海洋馆溺亡美人鱼案", "溺亡美人鱼案"],
                middle: "mid/middle-die.html",
                results: [
                    { description: "【A省晚报】2025.3.29-海洋馆美人鱼演员当众溺水！抢救无效身亡！", sequence: "1/22", href: "nightcord-1.html" },
                    { description: "【警方通报】关于美人鱼溺亡事件的调查通告", sequence: "2/22", href: "police1.html" },
                    { description: "【B市日报】泊然海洋馆面对市民的一封道歉信", sequence: "3/22", href: "B-daily-1.html" }
                ]
            },
            {
                keyword: "泊然海洋馆",
                aliases: ["泊然海洋馆", "泊然海洋馆官方网站"],
                middle: "mid/middle-Aquarium.html",
                results: [{ description: "泊然海洋馆主页", sequence: "4/22", href: "Aquarium.html" }]
            },
            {
                keyword: "安伯然",
                aliases: ["安伯然"],
                middle: "mid/middle-boran.html",
                results: [{ description: "【光明财经】独家专访安伯然：白手起家到慈善大亨-事业，家庭与他的理想", sequence: "5/22", href: "ikari economy-1.html" }]
            },
            {
                keyword: "泊然集团",
                aliases: ["泊然集团"],
                middle: "mid/middle-brcpny.html",
                results: [{ description: "【光明财经】经营不善，泊然集团的坍塌", sequence: "6/22", href: "ikari economy-2.html" }]
            },
            {
                keyword: "安仲斌",
                aliases: ["安仲斌"],
                middle: "mid/middle-azb.html",
                results: [{ description: "【B市日报】海洋馆新风！更先进，更环保！", sequence: "7/22", href: "B-daily-2.html" }]
            },
            {
                keyword: "安永德",
                aliases: ["安永德"],
                middle: "mid/middle-ayd.html",
                results: [{ description: "【B市日报】海洋馆经营遇困难？馆长直言需要市民支持！", sequence: "8/22", href: "B-daily-3.html" }]
            },
            {
                keyword: "贾剑明",
                aliases: ["贾剑明"],
                middle: "mid/middle-jjm.html",
                results: [
                    { description: "【B市日报】换任报道-海洋馆重建！新品种！新表演！新体验！", sequence: "9/22", href: "B-daily-4.html" },
                    { description: "【环球新资讯】泊然海洋馆重装开业在即！打卡攻略抢先看", sequence: "10/22", href: "earthnews-1.html" },
                    { description: "【向日葵娱乐】X市旅行约会新地点", sequence: "11/22", href: "entertainment-1.html" },
                    { description: "【B市日报】泊然海洋馆前馆长贾剑明被依法逮捕", sequence: "12/22", href: "B-daily-5.html" }
                ]
            },
            {
                keyword: "明通集团",
                aliases: ["明通集团"],
                middle: "mid/middle-mtjt.html",
                results: [{ description: "【光明财经】善恶有报，明通集团破产清算，旗下千余产业拍卖中", sequence: "13/22", href: "ikari economy-3.html" }]
            },
            {
                keyword: "杏仁网",
                aliases: ["杏仁网"],
                middle: "mid/middle-xingren.html",
                results: [{ description: "杏仁网官方网站", sequence: "14/22", href: "xingrenwang.html" }]
            },
            {
                keyword: "MT集团",
                aliases: ["MT集团"],
                middle: "mid/middle-MT.html",
                results: [{ description: "扒一扒那个最近落马的MT集团", sequence: "15/22", href: "talk.html" }]
            },
            {
                keyword: "蔚蓝传媒",
                aliases: ["蔚蓝传媒", "蔚蓝集团", "蔚蓝文化传媒有限公司"],
                middle: "mid/middle-bluemedia.html",
                results: [{ description: "蔚蓝传媒官方网站", sequence: "16/22", href: "bluemedia-1.html" }]
            },
            {
                keyword: "钱宏达",
                aliases: ["钱宏达"],
                middle: "mid/middle-qhd.html",
                results: [{ description: "【B市日报】蔚蓝传媒确认暂停部分业务，创始人钱宏达称“家事影响经营”", sequence: "17/22", href: "B-daily-6.html" }]
            },
            {
                keyword: "海洋馆保安拾金不昧",
                aliases: ["海洋馆保安拾金不昧", "海洋馆保安拾金不昧的报道"],
                middle: "mid/middle-jinqi.html",
                results: [{ description: "【B市日报】海洋馆保安拾金不昧，失主送锦旗致谢", sequence: "18/22", href: "B-daily-7.html" }]
            },
            {
                keyword: "劳而得",
                aliases: ["劳而得", "劳务派遣公司劳而得", "劳而得劳务派遣公司", "劳务公司劳而得", "劳而得劳务公司"],
                middle: "mid/middle-labor.html",
                results: [{ description: "劳务派遣公司-劳而得官方网站", sequence: "19/22", href: "labor company-1.html" }]
            },
            {
                keyword: "临时工溺亡",
                aliases: ["临时工溺亡"],
                middle: "mid/middle-linshi.html",
                results: [{ description: "【B市日报】闭馆期间发生意外，一名临时工溺亡训练池", sequence: "20/22", href: "B-daily-8.html" }]
            },
            {
                keyword: "B2025-JD-0718",
                aliases: ["B2025-JD-0718"],
                middle: "mid/middle-juanzong1.html",
                results: [{ description: "档案-B2025-JD-0718", sequence: "21/22", href: "B2025-JD-0718.html" }]
            },
            {
                keyword: "B2025-JD-0717",
                aliases: ["B2025-JD-0717"],
                middle: "mid/middle-warning.html",
                results: [{ description: "档案-B2025-JD-0717", sequence: "22/22", href: "B2025-JD-0717.html" }]
            }
            
        ];

        const keywordMap = Object.create(null);
        searchCatalog.forEach(entry => {
            entry.aliases.forEach(alias => {
                keywordMap[normalizeKeyword(alias)] = entry;
            });
        });

        function readHistory() {
            try {
                const value = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
                return Array.isArray(value) ? value : [];
            } catch (error) {
                return [];
            }
        }

        function rememberSearch(entry) {
            const history = readHistory();
            const knownPages = new Set(history.map(item => item.href));
            const discoveredAt = Date.now();

            entry.results.forEach((result, resultIndex) => {
                if (knownPages.has(result.href)) return;
                history.push({
                    keyword: entry.keyword,
                    description: result.description,
                    sequence: result.sequence,
                    href: result.href,
                    discoveredAt: discoveredAt + resultIndex
                });
                knownPages.add(result.href);
            });

            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }

        // ========== 搜索框回车触发 ==========
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                const rawKeyword = this.value.trim();                 // 原始输入（用于 URL 参数）
                const normalizedKeyword = normalizeKeyword(rawKeyword); // 规范化后（用于匹配）

                const matchedEntry = keywordMap[normalizedKeyword];
                const targetPage = matchedEntry ? matchedEntry.middle : "mid/middle404.html";

                // 只有正确关键词才会写入搜索历史；同一线索网页不会重复记录。
                if (matchedEntry) rememberSearch(matchedEntry);

                // 在新标签页打开，并附带原始 keyword 参数
                window.open(targetPage + "?keyword=" + encodeURIComponent(rawKeyword), "_blank");
            }
        });

        // 搜索历史按钮
        document.getElementById('historyBtn').addEventListener('click', () => {
            window.location.href = "research history.html";
        });

        // 调查结束按钮：弹窗（原逻辑不变）
        document.getElementById('endBtn').addEventListener('click', () => {
            if (window.EndingState && EndingState.hasEndingAccess()) {
                EndingState.updateEnding({ endingStarted: true, endingChatPhase: "initial" });
                window.location.href = "ending-chat.html";
                return;
            }
            alert("亲爱的调查员，你还有很多工作要做，还不能休息哦");
        });
    </script>
</body>
</html>
