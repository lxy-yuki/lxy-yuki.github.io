<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麦英基金会搜索页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #ffffff;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* 左上角Logo容器 */
        .logo-box {
            position: absolute;
            top: 0px;
            left: 30px;
            width: 350px;
            height: 240px;
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 右侧搜索区域整体容器 */
        .search-area {
            position: absolute;
            top: 80px;
            left: 34%;
            width: 62%;
        }
        .search-input {
            width: 100%;
            height: 50px;
            background-color: #FFB84E;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .search-icon-img {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            margin-left: 0px;
            object-fit: contain;
            vertical-align: middle;
            position: relative;
            top: 0px;
        }

        .search-input input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 16px;
        }
        .search-input input::placeholder {
            color: rgba(255,255,255,0.8);
        }

        /* 淡黄色渐变展示区域 */
        .gradient-block {
            width: 100%;
            height: 200px;
            margin-top: 15px;
            background: linear-gradient(to bottom, #FFF3D8, #ffffff);
            border-radius: 20px;
            padding: 25px;
        }
        .result-title {
            font-size: 20px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 20px;
        }
        .result-link {
            display: block;
            font-size: 16px;
            font-weight: normal;
            color: #0066cc;
            text-decoration: underline;
            margin-bottom: 12px;
        }
        .result-link:hover {
            color: #004999;
        }

        /* 左下角返回主页按钮 */
        .back-btn {
            position: absolute;
            bottom: 50px;
            left: 50px;
        }
        .back-btn a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 30px;
            background-color: #FFB84E;
            border-radius: 30px;
            color: #fff;
            text-decoration: none;
            font-size: 17px;
            transition: 0.2s;
        }
        .back-btn a:hover {
            background-color: #ffaa33;
        }
        .back-btn .arrow {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #fff;
            color: #FFB84E;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <!-- 左上角Logo -->
    <div class="logo-box">
        <img src="..\images\logo1.png" alt="麦英基金会logo">
    </div>

    <!-- 右侧搜索栏+渐变展示区域 -->
    <div class="search-area">
        <div class="search-input">
            <img class="search-icon-img" src="..\images\mirror1.png" alt="搜索图标">
            <!-- 添加 readonly 属性，使输入框不可编辑 -->
            <input type="text" id="searchDisplay" placeholder="请输入搜索内容" readonly>
        </div>
        
        <!-- 淡黄色渐变区域：自定义文字超链接 -->
        <div class="gradient-block">
            <div class="result-title">共找到如下1个搜索结果：</div>
            <a class="result-link" href="..\bluewhale-evidence.html">【明通集团破产资料摘录】蓝鲸贸易与泊然海洋馆：合同、付款和验收记录核对</a>
        </div>
    </div>

    <!-- 返回主页按钮 -->
    <div class="back-btn">
        <a href="..\maiyingfoundation.html">
            <span class="arrow">&lt;</span>
            返回主页
        </a>
    </div>

    <!-- 读取 URL 中的 keyword 参数并填入搜索框 -->
    <script>
        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }
        const keyword = getQueryParam('keyword');
        if (keyword) {
            document.getElementById('searchDisplay').value = decodeURIComponent(keyword);
        }
    </script>
</body>
</html>
