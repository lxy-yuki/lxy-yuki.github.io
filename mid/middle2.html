<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麦英基金会搜索页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #ffffff;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* 左上角Logo容器：可自由调整 位置/大小 */
        .logo-box {
            position: absolute;
            /* 位置：修改top/left可上下左右移动 */
            top: 0px;
            left: 30px;
            /* 大小：修改width/height可缩放图片 */
            width: 350px;
            height: 240px;
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 右侧搜索区域整体容器 */
        .search-area {
            position: absolute;
            top: 80px;
            left: 34%;
            width: 62%;
        }
        /* 橙色搜索输入框 */
        .search-input {
            width: 100%;
            height: 50px;
            background-color: #FFB84E;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }
        .search-input .icon {
            color: #fff;
            font-size: 22px;
            margin-right: 12px;
        }
        .search-input input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 16px;
        }
        .search-input input::placeholder {
            color: rgba(255,255,255,0.8);
        }

        /* 淡黄色渐变到白色 静态展示区域 */
        .gradient-block {
            width: 100%;
            height: 200px;
            margin-top: 15px;
            background: linear-gradient(to bottom, #FFF3D8, #ffffff);
            border-radius: 20px;
            /* 内边距，让文字不贴边 */
            padding: 25px;
        }
        /* 搜索结果标题：黑色加粗 + 大字号 */
        .result-title {
            font-size: 20px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 20px; /* 标题和链接之间的垂直间距 */
        }
        /* 蓝色超链接样式 + 多行间距 */
        .result-link {
            display: block; /* 独占一行 */
            font-size: 16px;
            font-weight: normal;
            color: #0066cc;
            text-decoration: underline;
            margin-bottom: 12px; /* 多个链接之间的垂直间距 */
        }
        /* 超链接 hover 效果 */
        .result-link:hover {
            color: #004999;
        }

        /* 左下角返回主页按钮 */
        .back-btn {
            position: absolute;
            bottom: 50px;
            left: 50px;
        }
        .back-btn a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 30px;
            background-color: #FFB84E;
            border-radius: 30px;
            color: #fff;
            text-decoration: none;
            font-size: 17px;
            transition: 0.2s;
        }
        .back-btn a:hover {
            background-color: #ffaa33;
        }
        .back-btn .arrow {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #fff;
            color: #FFB84E;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <!-- 左上角Logo -->
    <div class="logo-box">
        <img src="..\images\logo1.png" alt="麦英基金会logo">
    </div>

    <!-- 右侧搜索栏+渐变展示区域 -->
    <div class="search-area">
        <div class="search-input">
            <span class="icon">🔍</span>
            <input type="text" placeholder="请输入搜索内容">
        </div>
        
        <!-- 淡黄色渐变区域：自定义文字超链接 -->
        <div class="gradient-block">
            <!-- 黑色加粗大标题 -->
            <div class="result-title">共找到如下X个搜索结果：</div>
            
            <!-- 超链接格式：href=跳转链接，中间文字=页面显示的自定义内容 -->
            <a class="result-link" href="..\socialaccount1.html">陈树个人主页</a>
            
        </div>
    </div>

    <!-- 返回主页按钮 -->
    <div class="back-btn">
        <a href="maiyingfoundation.html">
            <span class="arrow">&lt;</span>
            返回主页
        </a>
    </div>
</body>
</html>
